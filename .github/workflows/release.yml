name: Release native Win32 app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$env:REQUESTED_VERSION'. Use vMAJOR.MINOR.PATCH, for example v0.1.0."
          }
          "RELEASE_TAG=$env:REQUESTED_VERSION" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test Rust core
        run: cargo test --lib

      - name: Build native Win32 app
        run: cargo build --release --bin DesktopLayoutManager --lib

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/release/DesktopLayoutManager.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Required release output is missing: $exe"
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  DesktopLayoutManager.exe" | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Desktop Layout Manager ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/DesktopLayoutManager.exe
            SHA256SUMS.txt
