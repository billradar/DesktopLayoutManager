name: Native Win32 build

on:
  push:
    branches: [main, native-win32-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test Rust core
        run: cargo test --lib
      - name: Build native Win32 app and resource-embedded icon
        run: cargo build --release --bin DesktopLayoutManager --lib
      - name: Verify release outputs
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/DesktopLayoutManager.exe)) { throw "Native GUI EXE missing" }
          if (-not (Test-Path target/release/desktop_layout_manager.dll)) { throw "Rust core DLL missing" }
          if ((Get-Item target/release/DesktopLayoutManager.exe).Length -le 100KB) { throw "EXE is unexpectedly small; check resource/link output" }
