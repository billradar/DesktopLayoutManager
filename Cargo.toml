[package]
name = "desktop-layout-manager"
version = "0.1.0"
edition = "2021"
description = "Native Win32 desktop layout manager with Rust core"
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "DesktopLayoutManager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Gdi"
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
