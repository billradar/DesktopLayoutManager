[package]
name = "desktop-layout-manager"
version = "0.1.0"
edition = "2021"
description = "Windows desktop icon layout engine for the WinUI 3 application"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
